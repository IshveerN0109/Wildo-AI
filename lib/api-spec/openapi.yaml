openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Cambridge AI Tutor API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: openai
    description: OpenAI AI chat operations
  - name: notes
    description: Study notes operations
  - name: flashcards
    description: Flashcard sets for revision
  - name: stats
    description: Study progress statistics
  - name: streak
    description: Study streak tracking
  - name: quiz
    description: Timed quiz sessions
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to returnTo on success.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: List all notes
      parameters:
        - name: subject
          in: query
          required: false
          schema:
            type: string
        - name: level
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
    post:
      operationId: createNote
      tags: [notes]
      summary: Create a new note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"

  /notes/{id}:
    get:
      operationId: getNote
      tags: [notes]
      summary: Get a single note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          description: Not found
    patch:
      operationId: updateNote
      tags: [notes]
      summary: Update a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteUpdate"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /notes/generate:
    post:
      operationId: generateNote
      tags: [notes]
      summary: AI-generate notes for a topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteGenerateInput"
      responses:
        "201":
          description: Generated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"

  /flashcard-sets:
    get:
      operationId: listFlashcardSets
      tags: [flashcards]
      summary: List all flashcard sets
      responses:
        "200":
          description: List of flashcard sets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlashcardSet"
    post:
      operationId: createFlashcardSet
      tags: [flashcards]
      summary: Create a new flashcard set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlashcardSetInput"
      responses:
        "201":
          description: Created flashcard set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardSet"

  /flashcard-sets/{id}:
    get:
      operationId: getFlashcardSet
      tags: [flashcards]
      summary: Get flashcard set with cards
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Flashcard set with cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardSetWithCards"
        "404":
          description: Not found
    delete:
      operationId: deleteFlashcardSet
      tags: [flashcards]
      summary: Delete a flashcard set
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /flashcard-sets/generate:
    post:
      operationId: generateFlashcardSet
      tags: [flashcards]
      summary: AI-generate a flashcard set for a topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlashcardGenerateInput"
      responses:
        "201":
          description: Generated flashcard set with cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardSetWithCards"

  /stats/summary:
    get:
      operationId: getStudySummary
      tags: [stats]
      summary: Get study summary stats
      responses:
        "200":
          description: Study stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySummary"

  /stats/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [stats]
      summary: Get recent study activity
      responses:
        "200":
          description: Recent activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /streak:
    get:
      operationId: getStreak
      tags: [streak]
      summary: Get the current user's study streak
      responses:
        "200":
          description: Study streak data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyStreak"

  /streak/record:
    post:
      operationId: recordStudyActivity
      tags: [streak]
      summary: Record a study activity and update the streak
      responses:
        "200":
          description: Updated streak
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyStreak"

  /quiz/generate:
    post:
      operationId: generateQuiz
      tags: [quiz]
      summary: AI-generate a timed quiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizGenerateInput"
      responses:
        "200":
          description: Generated quiz with questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedQuiz"

  /quiz/complete:
    post:
      operationId: completeQuiz
      tags: [quiz]
      summary: Save a completed quiz result and update streak
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizCompleteInput"
      responses:
        "200":
          description: Saved quiz session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSession"

  /quiz/history:
    get:
      operationId: getQuizHistory
      tags: [quiz]
      summary: Get past quiz sessions
      responses:
        "200":
          description: List of past quiz sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuizSession"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
          format: email
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        subject:
          type: ["string", "null"]
        level:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt

    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
        subject:
          type: string
        level:
          type: string
      required:
        - title

    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        subject:
          type: ["string", "null"]
        level:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages

    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    OpenaiMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    OpenaiVoiceMessageInput:
      type: object
      properties:
        audio:
          type: string
      required:
        - audio

    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Note:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        subject:
          type: string
        level:
          type: string
        topic:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - content
        - subject
        - level
        - createdAt
        - updatedAt

    NoteInput:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        subject:
          type: string
        level:
          type: string
        topic:
          type: string
      required:
        - title
        - content
        - subject
        - level

    NoteUpdate:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        subject:
          type: string
        level:
          type: string
        topic:
          type: string

    NoteGenerateInput:
      type: object
      properties:
        subject:
          type: string
        level:
          type: string
        topic:
          type: string
      required:
        - subject
        - level
        - topic

    FlashcardSet:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        subject:
          type: string
        level:
          type: string
        topic:
          type: ["string", "null"]
        cardCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - subject
        - level
        - cardCount
        - createdAt

    FlashcardSetInput:
      type: object
      properties:
        title:
          type: string
        subject:
          type: string
        level:
          type: string
        topic:
          type: string
      required:
        - title
        - subject
        - level

    FlashcardSetWithCards:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        subject:
          type: string
        level:
          type: string
        topic:
          type: ["string", "null"]
        cardCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        cards:
          type: array
          items:
            $ref: "#/components/schemas/Flashcard"
      required:
        - id
        - title
        - subject
        - level
        - cardCount
        - createdAt
        - cards

    Flashcard:
      type: object
      properties:
        id:
          type: integer
        setId:
          type: integer
        question:
          type: string
        answer:
          type: string
        hint:
          type: ["string", "null"]
      required:
        - id
        - setId
        - question
        - answer

    FlashcardGenerateInput:
      type: object
      properties:
        subject:
          type: string
        level:
          type: string
        topic:
          type: string
        count:
          type: integer
      required:
        - subject
        - level
        - topic

    StudySummary:
      type: object
      properties:
        totalNotes:
          type: integer
        totalFlashcardSets:
          type: integer
        totalConversations:
          type: integer
        subjectBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/SubjectCount"
      required:
        - totalNotes
        - totalFlashcardSets
        - totalConversations
        - subjectBreakdown

    SubjectCount:
      type: object
      properties:
        subject:
          type: string
        count:
          type: integer
      required:
        - subject
        - count

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        title:
          type: string
        subject:
          type: string
        level:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - title
        - subject
        - level
        - createdAt

    StudyStreak:
      type: object
      properties:
        currentStreak:
          type: integer
        longestStreak:
          type: integer
        lastStudiedDate:
          type: ["string", "null"]
      required:
        - currentStreak
        - longestStreak
        - lastStudiedDate

    QuizGenerateInput:
      type: object
      properties:
        subject:
          type: string
        level:
          type: string
        topic:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard]
      required:
        - subject
        - level
        - topic
        - difficulty

    QuizQuestion:
      type: object
      properties:
        question:
          type: string
        options:
          type: array
          items:
            type: string
        correctIndex:
          type: integer
        explanation:
          type: string
      required:
        - question
        - options
        - correctIndex
        - explanation

    GeneratedQuiz:
      type: object
      properties:
        subject:
          type: string
        level:
          type: string
        topic:
          type: string
        difficulty:
          type: string
        timePerQuestion:
          type: integer
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestion"
      required:
        - subject
        - level
        - topic
        - difficulty
        - timePerQuestion
        - questions

    QuizCompleteInput:
      type: object
      properties:
        subject:
          type: string
        level:
          type: string
        topic:
          type: string
        difficulty:
          type: string
        score:
          type: integer
        totalQuestions:
          type: integer
        timePerQuestion:
          type: integer
      required:
        - subject
        - level
        - topic
        - difficulty
        - score
        - totalQuestions
        - timePerQuestion

    QuizSession:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: ["string", "null"]
        subject:
          type: string
        level:
          type: string
        topic:
          type: string
        difficulty:
          type: string
        score:
          type: integer
        totalQuestions:
          type: integer
        timePerQuestion:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - subject
        - level
        - topic
        - difficulty
        - score
        - totalQuestions
        - timePerQuestion
        - createdAt
