openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Cambridge AI Tutor API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: openai
    description: OpenAI AI chat operations
  - name: notes
    description: Study notes operations
  - name: flashcards
    description: Flashcard sets for revision
  - name: stats
    description: Study progress statistics
  - name: streak
    description: Study streak tracking
  - name: quiz
    description: Timed quiz sessions
  - name: oral-practice
    description: Cambridge-style Oral English practice
  - name: Storage
    description: Private student file upload and serving endpoints.
  - name: subscription
    description: Student subscription plan and monthly feature usage.
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to returnTo on success.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /student/profile:
    get:
      tags: [student]
      operationId: getStudentProfile
      summary: Get the authenticated student's saved study profile
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "401":
          description: Authentication required

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a private student file upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL and saved attachment metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid file metadata
        "401":
          description: Authentication required
        "413":
          description: File is too large
        "415":
          description: File type is not supported
    put:
      tags: [student]
      operationId: updateStudentProfile
      summary: Save the authenticated student's study profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentProfileUpdate"
      responses:
        "200":
          description: Updated student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "401":
          description: Authentication required

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: List all notes
      parameters:
        - name: subject
          in: query
          required: false
          schema:
            type: string
        - name: level
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
    post:
      operationId: createNote
      tags: [notes]
      summary: Create a new note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"

  /notes/{id}:
    get:
      operationId: getNote
      tags: [notes]
      summary: Get a single note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          description: Not found
    patch:
      operationId: updateNote
      tags: [notes]
      summary: Update a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteUpdate"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /notes/generate:
    post:
      operationId: generateNote
      tags: [notes]
      summary: AI-generate notes for a topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteGenerateInput"
      responses:
        "201":
          description: Generated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"

  /flashcard-sets:
    get:
      operationId: listFlashcardSets
      tags: [flashcards]
      summary: List all flashcard sets
      responses:
        "200":
          description: List of flashcard sets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlashcardSet"
    post:
      operationId: createFlashcardSet
      tags: [flashcards]
      summary: Create a new flashcard set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlashcardSetInput"
      responses:
        "201":
          description: Created flashcard set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardSet"

  /flashcard-sets/{id}:
    get:
      operationId: getFlashcardSet
      tags: [flashcards]
      summary: Get flashcard set with cards
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Flashcard set with cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardSetWithCards"
        "404":
          description: Not found
    delete:
      operationId: deleteFlashcardSet
      tags: [flashcards]
      summary: Delete a flashcard set
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /flashcard-sets/generate:
    post:
      operationId: generateFlashcardSet
      tags: [flashcards]
      summary: AI-generate a flashcard set for a topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlashcardGenerateInput"
      responses:
        "201":
          description: Generated flashcard set with cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardSetWithCards"

  /stats/summary:
    get:
      operationId: getStudySummary
      tags: [stats]
      summary: Get study summary stats
      responses:
        "200":
          description: Study stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySummary"

  /stats/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [stats]
      summary: Get recent study activity
      responses:
        "200":
          description: Recent activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /streak:
    get:
      operationId: getStreak
      tags: [streak]
      summary: Get the current user's study streak
      responses:
        "200":
          description: Study streak data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyStreak"

  /streak/record:
    post:
      operationId: recordStudyActivity
      tags: [streak]
      summary: Record a study activity and update the streak
      responses:
        "200":
          description: Updated streak
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyStreak"

  /quiz/generate:
    post:
      operationId: generateQuiz
      tags: [quiz]
      summary: AI-generate a timed quiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizGenerateInput"
      responses:
        "200":
          description: Generated quiz with questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedQuiz"

  /quiz/complete:
    post:
      operationId: completeQuiz
      tags: [quiz]
      summary: Save a completed quiz result and update streak
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizCompleteInput"
      responses:
        "200":
          description: Saved quiz session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSession"

  /quiz/history:
    get:
      operationId: getQuizHistory
      tags: [quiz]
      summary: Get past quiz sessions
      responses:
        "200":
          description: List of past quiz sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuizSession"

  /oral-practice/evaluate:
    post:
      operationId: evaluateOralPractice
      tags: [oral-practice]
      summary: Transcribe and evaluate a student's spoken Cambridge-style answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OralPracticeEvaluateInput"
      responses:
        "200":
          description: Transcript, formative Cambridge-style assessment, and spoken examiner response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OralPracticeEvaluation"
        "400":
          description: Invalid request
        "422":
          description: No speech detected
        "500":
          description: Audio evaluation failed

  /subscription:
    get:
      operationId: getSubscriptionUsage
      tags: [subscription]
      summary: Get the current student's subscription plan and this month's feature usage
      responses:
        "200":
          description: Subscription plan and per-feature usage for the current billing period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionUsage"

  /subscription/plans:
    get:
      operationId: listSubscriptionPlans
      tags: [subscription]
      summary: List the plans a student can choose between
      responses:
        "200":
          description: Available plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionPlan"

  /subscription/select-plan:
    post:
      operationId: selectSubscriptionPlan
      tags: [subscription]
      summary: Switch the current student onto a different plan
      description: >-
        Activates immediately. No payment is collected yet — see
        SubscriptionPlan.priceCents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectPlanBody"
      responses:
        "200":
          description: Updated subscription usage on the newly selected plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionUsage"
        "400":
          description: Unknown plan id

  /subscription/checkout:
    post:
      operationId: createSubscriptionCheckout
      tags: [subscription]
      summary: Start a Stripe Checkout session to upgrade to a paid plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutSessionBody"
      responses:
        "200":
          description: Checkout URL to redirect the student to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResponse"
        "400":
          description: Unknown or free plan id
        "503":
          description: Stripe is not configured

  /subscription/portal:
    get:
      operationId: getSubscriptionPortal
      tags: [subscription]
      summary: Get a link to the Stripe-hosted billing portal (manage card, invoices, cancel)
      responses:
        "200":
          description: Portal URL to redirect the student to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResponse"
        "400":
          description: Student has no Stripe customer yet (never checked out)
        "503":
          description: Stripe is not configured

  /subscription/credit-packs:
    get:
      operationId: listCreditPacks
      tags: [subscription]
      summary: List purchasable credit top-up packs
      responses:
        "200":
          description: Active credit packs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreditPack"

  /subscription/topup/checkout:
    post:
      operationId: createTopupCheckout
      tags: [subscription]
      summary: Start a Stripe Checkout session to purchase a credit pack
      description: Only allowed when the student's current plan has allowsTopups=true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopupCheckoutBody"
      responses:
        "200":
          description: Checkout URL to redirect the student to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResponse"
        "400":
          description: Unknown credit pack id
        "403":
          description: Current plan does not allow purchasing top-ups
        "503":
          description: Stripe is not configured

  /admin/plans:
    get:
      operationId: adminListPlans
      tags: [admin]
      summary: List all plans, including inactive ones (admin only)
      responses:
        "200":
          description: All plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPlan"
        "403":
          description: Admin access required

  /admin/plans/{id}:
    put:
      operationId: adminUpdatePlan
      tags: [admin]
      summary: Update a plan's price, limits, top-up eligibility, or visibility (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPlanUpdateBody"
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPlan"
        "403":
          description: Admin access required
        "404":
          description: Unknown plan id

  /admin/credit-packs:
    get:
      operationId: adminListCreditPacks
      tags: [admin]
      summary: List all credit packs, including inactive ones (admin only)
      responses:
        "200":
          description: All credit packs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminCreditPack"
        "403":
          description: Admin access required
    post:
      operationId: adminCreateCreditPack
      tags: [admin]
      summary: Create a credit pack (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreditPackInput"
      responses:
        "201":
          description: Created credit pack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCreditPack"
        "403":
          description: Admin access required

  /admin/credit-packs/{id}:
    put:
      operationId: adminUpdateCreditPack
      tags: [admin]
      summary: Update a credit pack (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreditPackInput"
      responses:
        "200":
          description: Updated credit pack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCreditPack"
        "403":
          description: Admin access required
        "404":
          description: Unknown credit pack id
    delete:
      operationId: adminDeleteCreditPack
      tags: [admin]
      summary: Delete a credit pack (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Admin access required
        "404":
          description: Unknown credit pack id

  /admin/dashboard:
    get:
      operationId: adminGetDashboard
      tags: [admin]
      summary: Business metrics -- subscriber counts, estimated revenue, AI provider cost (admin only)
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboardStats"
        "403":
          description: Admin access required

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl, isAdmin]
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
          format: email
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
        isAdmin:
          type: boolean
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    StudentProfile:
      type: object
      required: [level]
      properties:
        level:
          type: ["string", "null"]
          enum: [O Level, A Level, null]
    StudentProfileUpdate:
      type: object
      required: [level]
      properties:
        level:
          type: ["string", "null"]
          enum: [O Level, A Level, null]
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath, attachmentId, metadata]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        attachmentId:
          type: integer
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        subject:
          type: ["string", "null"]
        level:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt

    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
        subject:
          type: string
        level:
          type: string
      required:
        - title

    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        subject:
          type: ["string", "null"]
        level:
          type: ["string", "null"]
        createdAt:
          type: string
