      type: object
      properties:
        feature:
          $ref: "#/components/schemas/SubscriptionFeature"
        used:
          type: integer
          description: Units consumed so far in the current billing period.
        limit:
          type: integer
          description: Units included in the student's plan for this feature, per billing period.
        remaining:
          type: integer
          description: Units left before the student hits their limit for this feature.
      required: [feature, used, limit, remaining]

    SubscriptionUsage:
      type: object
      properties:
        planId:
          type: string
        planName:
          type: string
        status:
          type: string
          enum: [active, canceled, past_due, expired]
        currentPeriodStart:
          type: string
          format: date-time
        currentPeriodEnd:
          type: string
          format: date-time
        allowsTopups:
          type: boolean
          description: Whether the student's current plan permits purchasing extra credit packs.
        usage:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionFeatureUsage"
      required:
        - planId
        - planName
        - status
        - currentPeriodStart
        - currentPeriodEnd
        - allowsTopups
        - usage

    SubscriptionPlanLimit:
      type: object
      properties:
        feature:
          $ref: "#/components/schemas/SubscriptionFeature"
        limit:
          type: integer
          description: Units included per billing period for this feature on this plan.
      required: [feature, limit]

    SubscriptionPlan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        priceCents:
          type: integer
          description: Monthly price in cents (0 = free).
        allowsTopups:
          type: boolean
        limits:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionPlanLimit"
      required: [id, name, priceCents, allowsTopups, limits]

